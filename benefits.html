  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"822f4a03-24bd-4ba7-ac0a-969cec8686ca\") format(\"opentype\");font-weight:900;font-style:normal;font-display:swap}\n<\u002Fstyle>\n  <style>/* NAZDAR COLOR TOKENS\n   Source: Nazdar Logo Guidelines (2023), via nazdar-design-system/src/styles/tokens.css\n   BRAND layer    = in the official guide. Authoritative.\n   EXTENDED layer = added for UI usability. NOT approved by Marketing Communications. */\n\n:root{\n  /* ---- BRAND ---- */\n  --color-nz-red:#CF102D;        /* PMS 186  | 5.58:1  | fills, display, primary action */\n  --color-nz-red-dark:#A91623;   /* PMS 187  | 7.43:1  | brand text, links, hover */\n  --color-nz-green:#A3CF60;      /* PMS 367  | 1.80:1  | Ink Technologies, fill only */\n  --color-nz-green-dark:#7FA44C; /* PMS 576  | Ink Technologies, darker */\n  --color-nz-blue:#0099D6;       /* PMS 2925 | 3.22:1  | SourceOne */\n  --color-nz-blue-dark:#007CBA;  /* PMS 7461 | 4.57:1  | links, focus rings */\n  --color-nz-black:#000000;\n  --color-nz-gray-dark:#323E48;  /* PMS 432  | 10.95:1 | default body text */\n  --color-nz-gray-cool:#666666;  /* 5.74:1   | secondary text, captions */\n\n  /* ---- EXTENDED: neutral ramp, hue-matched to PMS 432 ---- */\n  --color-nz-neutral-50:#F7F8F9;\n  --color-nz-neutral-100:#EDEFF1;\n  --color-nz-neutral-200:#DDE1E5;\n  --color-nz-neutral-300:#C3C9CF;\n  --color-nz-neutral-400:#98A1AA;\n  --color-nz-neutral-500:#6B7580;\n  --color-nz-neutral-600:#4E5862;\n  --color-nz-neutral-700:#323E48;\n  --color-nz-neutral-800:#232C33;\n  --color-nz-neutral-900:#14191D;\n\n  /* ---- EXTENDED: feedback. Deliberately excludes brand red. ---- */\n  --color-nz-success:#2E7D4F;\n  --color-nz-success-bg:#EAF4EE;\n  --color-nz-success-text:#1E4F33;\n  --color-nz-warning:#B4690E;\n  --color-nz-warning-bg:#FDF3E3;\n  --color-nz-warning-text:#6E4109;\n  --color-nz-error:#8C1D2B;\n  --color-nz-error-bg:#FBEDEF;\n  --color-nz-error-text:#5E131D;\n  --color-nz-info:#007CBA;\n  --color-nz-info-bg:#E6F4FB;\n  --color-nz-info-text:#004E75;\n\n  /* ---- SEMANTIC. Components read these, never raw brand colors. ---- */\n  --nz-accent:var(--color-nz-red);\n  --nz-accent-dark:var(--color-nz-red-dark);  /* FILL ONLY. Hover/pressed fills. Not guaranteed to hold text. */\n  --nz-accent-ink:var(--color-nz-red-dark);  /* TEXT ONLY. Accent-colored text on a light surface. Always clears AA. */\n  --nz-accent-text:#FFFFFF;\n\n  --nz-text-primary:var(--color-nz-gray-dark);\n  --nz-text-secondary:var(--color-nz-gray-cool);\n  --nz-text-link:var(--color-nz-blue-dark);\n  --nz-border:var(--color-nz-neutral-200);\n  --nz-border-strong:var(--color-nz-neutral-300);\n  --nz-border-focus:var(--color-nz-blue-dark);\n  --nz-surface:#FFFFFF;\n  --nz-surface-sunken:var(--color-nz-neutral-50);\n}\n\n/* Division theming. The Z symbol stays red in all three logos, so only the\n   surrounding accent changes. Never recolor the Z.\n\n   --nz-accent-dark and --nz-accent-ink diverge on Ink Technologies and that is\n   deliberate. PMS 576 (#7FA44C) is 2.87:1 on white, so it can be a hover FILL\n   but never TEXT. Rather than invent a darker green outside the official nine,\n   Ink Technologies borrows PMS 432 for accent-colored text: brand-approved and\n   10.95:1. If Marketing Communications approves a darker green, set it here. */\n.nz-theme-master{--nz-accent:var(--color-nz-red);--nz-accent-dark:var(--color-nz-red-dark);--nz-accent-ink:var(--color-nz-red-dark);--nz-accent-text:#FFFFFF}\n.nz-theme-inktech{--nz-accent:var(--color-nz-green);--nz-accent-dark:var(--color-nz-green-dark);--nz-accent-ink:var(--color-nz-gray-dark);--nz-accent-text:var(--color-nz-neutral-900)}\n.nz-theme-sourceone{--nz-accent:var(--color-nz-blue);--nz-accent-dark:var(--color-nz-blue-dark);--nz-accent-ink:var(--color-nz-blue-dark);--nz-accent-text:#FFFFFF}\n\n/* CONFLICTS in the source PDF, unresolved. The guide's hex column disagrees with\n   its own RGB column twice; RGB matches the stated Pantone, so RGB wins.\n   1. Nazdar Red: RGB 207/16/45 = #CF102D (in use), not the guide's #D90000.\n   2. Dark Gray:  RGB 50/62/72  = #323E48 (in use), not the guide's #191919.\n   If Marketing rules the other way, change those two values here. Nothing else moves. */\n<\u002Fstyle>\n  <style>/* NAZDAR TYPOGRAPHY TOKENS\n\n   Campton is the brand face in Light 300 / Book 400 / Medium 500 / Bold 700.\n   The licensed webfont ships with this system — see tokens/fonts.css.\n   The Calibri / Arial fallbacks stay in the stack: they are the guide's own\n   instruction for Microsoft Office output and for any surface that cannot\n   load the webfont. Never substitute a Google Font lookalike (Montserrat,\n   Poppins, Jost). */\n\n:root{\n  --font-display:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-body:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-mono:ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n\n  --nz-weight-light:300;\n  --nz-weight-book:400;\n  --nz-weight-medium:500;\n  --nz-weight-bold:700;\n\n  /* EXTENDED: 1.25 ratio on a 16px base */\n  --text-xs:0.75rem;     /* 12px */\n  --text-sm:0.875rem;    /* 14px */\n  --text-base:1rem;      /* 16px */\n  --text-lg:1.25rem;     /* 20px */\n  --text-xl:1.5625rem;   /* 25px */\n  --text-2xl:1.953rem;   /* 31px */\n  --text-3xl:2.441rem;   /* 39px */\n  --text-4xl:3.052rem;   /* 49px */\n\n  --nz-leading-none:1;\n  --nz-leading-tight:1.15;\n  --nz-leading-snug:1.35;\n  --nz-leading-body:1.55;\n\n  /* Negative tracking on display sizes, wide tracking on small caps labels */\n  --nz-tracking-tight:-0.02em;\n  --nz-tracking-label:0.08em;\n  --nz-tracking-label-wide:0.12em;\n}\n<\u002Fstyle>\n  <style>/* NAZDAR SPACE, RADII, ELEVATION  (EXTENDED layer, not in the official guide)\n   Spacing runs on a 4px base. Radii stay tight: 2px to 8px. The Z symbol is\n   built from hard angular cuts, so heavy rounding fights the mark. */\n\n:root{\n  --nz-space-1:4px;\n  --nz-space-2:8px;\n  --nz-space-3:12px;\n  --nz-space-4:16px;\n  --nz-space-5:20px;\n  --nz-space-6:24px;\n  --nz-space-8:32px;\n  --nz-space-10:40px;\n  --nz-space-12:48px;\n  --nz-space-16:64px;\n\n  --radius-nz-sm:2px;\n  --radius-nz-md:4px;\n  --radius-nz-lg:8px;\n\n  /* Tinted with the cool blue-slate of PMS 432, never pure black. Never a glow. */\n  --shadow-nz-sm:0 1px 2px rgba(20,25,29,0.08);\n  --shadow-nz-md:0 2px 8px rgba(20,25,29,0.10);\n  --shadow-nz-lg:0 8px 24px rgba(20,25,29,0.12);\n\n  --nz-content-max:1080px; /* @kind spacing */\n  --nz-duration:200ms; /* @kind other */\n  --nz-ease:ease; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* NAZDAR BASE. Surfaces are white. Backgrounds are white or a very light cool\n   gray, never colored fields. */\n\nbody{\n  margin:0;\n  background:var(--nz-surface);\n  color:var(--nz-text-primary);\n  font-family:var(--font-body);\n  font-size:var(--text-base);\n  line-height:var(--nz-leading-body);\n  -webkit-font-smoothing:antialiased;\n}\n\na{color:var(--nz-text-link);text-decoration:underline;text-underline-offset:2px}\na:hover{color:var(--color-nz-red-dark)}\n\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--nz-weight-bold);line-height:var(--nz-leading-tight);letter-spacing:var(--nz-tracking-tight);margin:0}\ncode,kbd,pre{font-family:var(--font-mono)}\n\n*:focus-visible{outline:2px solid var(--nz-border-focus);outline-offset:2px}\n\n/* Small uppercase label, the brand's one recurring text device */\n.nz-label{font-size:var(--text-xs);font-weight:var(--nz-weight-bold);text-transform:uppercase;letter-spacing:var(--nz-tracking-label-wide);color:var(--nz-text-secondary)}\n\n/* Angular red rule. A structural echo of the mark's diagonal cut, not a\n   reproduction of it. Never a gradient. */\n.nz-rule-diagonal{height:6px;background:var(--nz-accent);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}\n}\n<\u002Fstyle>\n  <style>/* Nazdar component styles. Values transcribed exactly from the source Tailwind\n   utility strings in nazdar-design-system/src/components/*.jsx. No hex here. */\n\n/* ---- Button ---- */\n.nz-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--nz-space-2);font-family:var(--font-body);font-weight:var(--nz-weight-bold);cursor:pointer;border-radius:var(--radius-nz-md);border:1px solid transparent;transition:background-color var(--nz-duration) var(--nz-ease),color var(--nz-duration) var(--nz-ease),border-color var(--nz-duration) var(--nz-ease);text-decoration:none;line-height:var(--nz-leading-snug)}\n.nz-btn--sm{font-size:var(--text-sm);padding:6px 12px}\n.nz-btn--md{font-size:var(--text-base);padding:10px 18px}\n.nz-btn--lg{font-size:var(--text-lg);padding:12px 24px}\n.nz-btn--primary{background:var(--nz-accent);color:var(--nz-accent-text)}\n.nz-btn--primary:hover:not(:disabled){background:var(--nz-accent-dark)}\n.nz-btn--secondary{background:#fff;color:var(--nz-accent-ink);border-color:var(--nz-border-strong)}\n.nz-btn--secondary:hover:not(:disabled){background:var(--color-nz-neutral-50)}\n.nz-btn--destructive{background:var(--color-nz-error);color:#fff}\n.nz-btn--destructive:hover:not(:disabled){filter:brightness(0.9)}\n.nz-btn--quiet{background:transparent;color:var(--nz-text-link);text-decoration:underline;padding-left:6px;padding-right:6px}\n.nz-btn--quiet:hover:not(:disabled){color:var(--nz-accent-ink)}\n.nz-btn:disabled{cursor:not-allowed;background:var(--color-nz-neutral-300);color:var(--color-nz-neutral-500);border-color:transparent;filter:none}\n\n/* ---- Badge ---- */\n.nz-badge{display:inline-block;font-size:10px;font-weight:var(--nz-weight-bold);letter-spacing:0.1em;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-nz-sm);line-height:1.4}\n.nz-badge--brand{background:var(--color-nz-red-dark);color:#fff}\n.nz-badge--neutral{background:var(--color-nz-neutral-200);color:var(--color-nz-neutral-700)}\n.nz-badge--success{background:var(--color-nz-success-bg);color:var(--color-nz-success)}\n.nz-badge--warning{background:var(--color-nz-warning-bg);color:var(--color-nz-warning)}\n.nz-badge--error{background:var(--color-nz-error-bg);color:var(--color-nz-error)}\n\n/* ---- Card ---- */\n.nz-card{background:#fff;border:1px solid var(--nz-border);border-radius:var(--radius-nz-md);box-shadow:var(--shadow-nz-sm);overflow:hidden}\n.nz-card__head{background:var(--nz-accent);color:var(--nz-accent-text);padding:12px 16px}\n.nz-card__head p{margin:0;font-family:var(--font-display);font-weight:var(--nz-weight-bold);font-size:var(--text-lg)}\n.nz-card__body{padding:16px}\n\n/* ---- Alert. Hard left border, never an icon circle. ---- */\n.nz-alert{display:flex;gap:12px;padding:16px;margin-bottom:12px;border-radius:var(--radius-nz-md);border-left:4px solid;font-size:var(--text-sm)}\n.nz-alert__mark{font-weight:var(--nz-weight-bold);flex-shrink:0}\n.nz-alert__body strong{display:block}\n.nz-alert--success{background:var(--color-nz-success-bg);border-color:var(--color-nz-success);color:var(--color-nz-success-text)}\n.nz-alert--warning{background:var(--color-nz-warning-bg);border-color:var(--color-nz-warning);color:var(--color-nz-warning-text)}\n.nz-alert--error{background:var(--color-nz-error-bg);border-color:var(--color-nz-error);color:var(--color-nz-error-text)}\n.nz-alert--info{background:var(--color-nz-info-bg);border-color:var(--color-nz-info);color:var(--color-nz-info-text)}\n\n/* ---- Field: Input, Select ---- */\n.nz-field{max-width:24rem}\n.nz-field__label{display:block;font-size:var(--text-sm);font-weight:var(--nz-weight-bold);margin-bottom:8px;color:var(--color-nz-gray-dark)}\n.nz-field__control{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--radius-nz-md);background:#fff;color:var(--color-nz-gray-dark);font-family:var(--font-body);font-size:var(--text-base);border:1px solid var(--nz-border-strong);transition:border-color var(--nz-duration) var(--nz-ease)}\n.nz-field__control::placeholder{color:var(--color-nz-neutral-400)}\n.nz-field__control:focus{border-color:var(--color-nz-blue-dark)}\n.nz-field__control--error,.nz-field__control--error:focus{border-color:var(--color-nz-error)}\n.nz-field__control:disabled{background:var(--color-nz-neutral-50);color:var(--color-nz-neutral-500);cursor:not-allowed}\n.nz-field__hint{font-size:var(--text-xs);color:var(--color-nz-neutral-500);margin:8px 0 0}\n.nz-field__error{font-size:var(--text-xs);color:var(--color-nz-error);font-weight:var(--nz-weight-bold);margin:8px 0 0}\n\n/* ---- Table. 2px accent underline on the header, single hairline rows. ---- */\n.nz-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}\n.nz-table th{text-align:left;padding:12px;background:var(--color-nz-neutral-50);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.06em;border-bottom:2px solid var(--nz-accent)}\n.nz-table td{padding:12px;border-bottom:1px solid var(--color-nz-neutral-200)}\n<\u002Fstyle>\n  <style>/* NAZDAR WEBFONTS — Campton (licensed, supplied by Nazdar Marketing Communications).\n   Weights map to the brand guide's four: Light 300 / Book 400 / Medium 500 / Bold 700.\n   SemiBold 600 and Black 900 are included for display use only.\n   OTF is served directly; ask Marketing for a woff2 kit if payload size matters. */\n\n@font-face{font-family:\"Campton\";src:url(\"df14613a-afbc-4a47-b03a-5cd773184b40\") format(\"opentype\");font-weight:300;font-style:normal;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"c0d36e9c-b6a2-4f2c-81d2-0246f78cf44e\") format(\"opentype\");font-weight:300;font-style:italic;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"f8791f2b-41df-43d4-85ff-9bfd856c5b6c\") format(\"opentype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"90e18102-74b1-4e4e-af89-92b392798258\") format(\"opentype\");font-weight:400;font-style:italic;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"263655e6-c6f0-4d9c-b684-cd2039e4b6a2\") format(\"opentype\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"b39ada3b-a4bd-4651-9a92-ea6796197dc3\") format(\"opentype\");font-weight:500;font-style:italic;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"32a15e1c-a4c4-46aa-890b-94c555f66ee4\") format(\"opentype\");font-weight:600;font-style:normal;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"e624dd6d-1f02-4132-bb68-f659e39745af\") format(\"opentype\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"6cd5aca0-0558-4292-a251-834035616a0f\") format(\"opentype\");font-weight:700;font-style:italic;font-display:swap}\n@font-face{font-family:\"Campton\";src:url(\"822f4a03-24bd-4ba7-ac0a-969cec8686ca\") format(\"opentype\");font-weight:900;font-style:normal;font-display:swap}\n\n/* NAZDAR COLOR TOKENS\n   Source: Nazdar Logo Guidelines (2023), via nazdar-design-system/src/styles/tokens.css\n   BRAND layer    = in the official guide. Authoritative.\n   EXTENDED layer = added for UI usability. NOT approved by Marketing Communications. */\n\n:root{\n  /* ---- BRAND ---- */\n  --color-nz-red:#CF102D;        /* PMS 186  | 5.58:1  | fills, display, primary action */\n  --color-nz-red-dark:#A91623;   /* PMS 187  | 7.43:1  | brand text, links, hover */\n  --color-nz-green:#A3CF60;      /* PMS 367  | 1.80:1  | Ink Technologies, fill only */\n  --color-nz-green-dark:#7FA44C; /* PMS 576  | Ink Technologies, darker */\n  --color-nz-blue:#0099D6;       /* PMS 2925 | 3.22:1  | SourceOne */\n  --color-nz-blue-dark:#007CBA;  /* PMS 7461 | 4.57:1  | links, focus rings */\n  --color-nz-black:#000000;\n  --color-nz-gray-dark:#323E48;  /* PMS 432  | 10.95:1 | default body text */\n  --color-nz-gray-cool:#666666;  /* 5.74:1   | secondary text, captions */\n\n  /* ---- EXTENDED: neutral ramp, hue-matched to PMS 432 ---- */\n  --color-nz-neutral-50:#F7F8F9;\n  --color-nz-neutral-100:#EDEFF1;\n  --color-nz-neutral-200:#DDE1E5;\n  --color-nz-neutral-300:#C3C9CF;\n  --color-nz-neutral-400:#98A1AA;\n  --color-nz-neutral-500:#6B7580;\n  --color-nz-neutral-600:#4E5862;\n  --color-nz-neutral-700:#323E48;\n  --color-nz-neutral-800:#232C33;\n  --color-nz-neutral-900:#14191D;\n\n  /* ---- EXTENDED: feedback. Deliberately excludes brand red. ---- */\n  --color-nz-success:#2E7D4F;\n  --color-nz-success-bg:#EAF4EE;\n  --color-nz-success-text:#1E4F33;\n  --color-nz-warning:#B4690E;\n  --color-nz-warning-bg:#FDF3E3;\n  --color-nz-warning-text:#6E4109;\n  --color-nz-error:#8C1D2B;\n  --color-nz-error-bg:#FBEDEF;\n  --color-nz-error-text:#5E131D;\n  --color-nz-info:#007CBA;\n  --color-nz-info-bg:#E6F4FB;\n  --color-nz-info-text:#004E75;\n\n  /* ---- SEMANTIC. Components read these, never raw brand colors. ---- */\n  --nz-accent:var(--color-nz-red);\n  --nz-accent-dark:var(--color-nz-red-dark);  /* FILL ONLY. Hover/pressed fills. Not guaranteed to hold text. */\n  --nz-accent-ink:var(--color-nz-red-dark);  /* TEXT ONLY. Accent-colored text on a light surface. Always clears AA. */\n  --nz-accent-text:#FFFFFF;\n\n  --nz-text-primary:var(--color-nz-gray-dark);\n  --nz-text-secondary:var(--color-nz-gray-cool);\n  --nz-text-link:var(--color-nz-blue-dark);\n  --nz-border:var(--color-nz-neutral-200);\n  --nz-border-strong:var(--color-nz-neutral-300);\n  --nz-border-focus:var(--color-nz-blue-dark);\n  --nz-surface:#FFFFFF;\n  --nz-surface-sunken:var(--color-nz-neutral-50);\n}\n\n/* Division theming. The Z symbol stays red in all three logos, so only the\n   surrounding accent changes. Never recolor the Z.\n\n   --nz-accent-dark and --nz-accent-ink diverge on Ink Technologies and that is\n   deliberate. PMS 576 (#7FA44C) is 2.87:1 on white, so it can be a hover FILL\n   but never TEXT. Rather than invent a darker green outside the official nine,\n   Ink Technologies borrows PMS 432 for accent-colored text: brand-approved and\n   10.95:1. If Marketing Communications approves a darker green, set it here. */\n.nz-theme-master{--nz-accent:var(--color-nz-red);--nz-accent-dark:var(--color-nz-red-dark);--nz-accent-ink:var(--color-nz-red-dark);--nz-accent-text:#FFFFFF}\n.nz-theme-inktech{--nz-accent:var(--color-nz-green);--nz-accent-dark:var(--color-nz-green-dark);--nz-accent-ink:var(--color-nz-gray-dark);--nz-accent-text:var(--color-nz-neutral-900)}\n.nz-theme-sourceone{--nz-accent:var(--color-nz-blue);--nz-accent-dark:var(--color-nz-blue-dark);--nz-accent-ink:var(--color-nz-blue-dark);--nz-accent-text:#FFFFFF}\n\n/* CONFLICTS in the source PDF, unresolved. The guide's hex column disagrees with\n   its own RGB column twice; RGB matches the stated Pantone, so RGB wins.\n   1. Nazdar Red: RGB 207/16/45 = #CF102D (in use), not the guide's #D90000.\n   2. Dark Gray:  RGB 50/62/72  = #323E48 (in use), not the guide's #191919.\n   If Marketing rules the other way, change those two values here. Nothing else moves. */\n\n/* NAZDAR TYPOGRAPHY TOKENS\n\n   Campton is the brand face in Light 300 / Book 400 / Medium 500 / Bold 700.\n   The licensed webfont ships with this system — see tokens/fonts.css.\n   The Calibri / Arial fallbacks stay in the stack: they are the guide's own\n   instruction for Microsoft Office output and for any surface that cannot\n   load the webfont. Never substitute a Google Font lookalike (Montserrat,\n   Poppins, Jost). */\n\n:root{\n  --font-display:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-body:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-mono:ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n\n  --nz-weight-light:300;\n  --nz-weight-book:400;\n  --nz-weight-medium:500;\n  --nz-weight-bold:700;\n\n  /* EXTENDED: 1.25 ratio on a 16px base */\n  --text-xs:0.75rem;     /* 12px */\n  --text-sm:0.875rem;    /* 14px */\n  --text-base:1rem;      /* 16px */\n  --text-lg:1.25rem;     /* 20px */\n  --text-xl:1.5625rem;   /* 25px */\n  --text-2xl:1.953rem;   /* 31px */\n  --text-3xl:2.441rem;   /* 39px */\n  --text-4xl:3.052rem;   /* 49px */\n\n  --nz-leading-none:1;\n  --nz-leading-tight:1.15;\n  --nz-leading-snug:1.35;\n  --nz-leading-body:1.55;\n\n  /* Negative tracking on display sizes, wide tracking on small caps labels */\n  --nz-tracking-tight:-0.02em;\n  --nz-tracking-label:0.08em;\n  --nz-tracking-label-wide:0.12em;\n}\n\n/* NAZDAR SPACE, RADII, ELEVATION  (EXTENDED layer, not in the official guide)\n   Spacing runs on a 4px base. Radii stay tight: 2px to 8px. The Z symbol is\n   built from hard angular cuts, so heavy rounding fights the mark. */\n\n:root{\n  --nz-space-1:4px;\n  --nz-space-2:8px;\n  --nz-space-3:12px;\n  --nz-space-4:16px;\n  --nz-space-5:20px;\n  --nz-space-6:24px;\n  --nz-space-8:32px;\n  --nz-space-10:40px;\n  --nz-space-12:48px;\n  --nz-space-16:64px;\n\n  --radius-nz-sm:2px;\n  --radius-nz-md:4px;\n  --radius-nz-lg:8px;\n\n  /* Tinted with the cool blue-slate of PMS 432, never pure black. Never a glow. */\n  --shadow-nz-sm:0 1px 2px rgba(20,25,29,0.08);\n  --shadow-nz-md:0 2px 8px rgba(20,25,29,0.10);\n  --shadow-nz-lg:0 8px 24px rgba(20,25,29,0.12);\n\n  --nz-content-max:1080px; /* @kind spacing */\n  --nz-duration:200ms; /* @kind other */\n  --nz-ease:ease; /* @kind other */\n}\n\n/* NAZDAR BASE. Surfaces are white. Backgrounds are white or a very light cool\n   gray, never colored fields. */\n\nbody{\n  margin:0;\n  background:var(--nz-surface);\n  color:var(--nz-text-primary);\n  font-family:var(--font-body);\n  font-size:var(--text-base);\n  line-height:var(--nz-leading-body);\n  -webkit-font-smoothing:antialiased;\n}\n\na{color:var(--nz-text-link);text-decoration:underline;text-underline-offset:2px}\na:hover{color:var(--color-nz-red-dark)}\n\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--nz-weight-bold);line-height:var(--nz-leading-tight);letter-spacing:var(--nz-tracking-tight);margin:0}\ncode,kbd,pre{font-family:var(--font-mono)}\n\n*:focus-visible{outline:2px solid var(--nz-border-focus);outline-offset:2px}\n\n/* Small uppercase label, the brand's one recurring text device */\n.nz-label{font-size:var(--text-xs);font-weight:var(--nz-weight-bold);text-transform:uppercase;letter-spacing:var(--nz-tracking-label-wide);color:var(--nz-text-secondary)}\n\n/* Angular red rule. A structural echo of the mark's diagonal cut, not a\n   reproduction of it. Never a gradient. */\n.nz-rule-diagonal{height:6px;background:var(--nz-accent);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}\n}\n\n/* Nazdar component styles. Values transcribed exactly from the source Tailwind\n   utility strings in nazdar-design-system/src/components/*.jsx. No hex here. */\n\n/* ---- Button ---- */\n.nz-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--nz-space-2);font-family:var(--font-body);font-weight:var(--nz-weight-bold);cursor:pointer;border-radius:var(--radius-nz-md);border:1px solid transparent;transition:background-color var(--nz-duration) var(--nz-ease),color var(--nz-duration) var(--nz-ease),border-color var(--nz-duration) var(--nz-ease);text-decoration:none;line-height:var(--nz-leading-snug)}\n.nz-btn--sm{font-size:var(--text-sm);padding:6px 12px}\n.nz-btn--md{font-size:var(--text-base);padding:10px 18px}\n.nz-btn--lg{font-size:var(--text-lg);padding:12px 24px}\n.nz-btn--primary{background:var(--nz-accent);color:var(--nz-accent-text)}\n.nz-btn--primary:hover:not(:disabled){background:var(--nz-accent-dark)}\n.nz-btn--secondary{background:#fff;color:var(--nz-accent-ink);border-color:var(--nz-border-strong)}\n.nz-btn--secondary:hover:not(:disabled){background:var(--color-nz-neutral-50)}\n.nz-btn--destructive{background:var(--color-nz-error);color:#fff}\n.nz-btn--destructive:hover:not(:disabled){filter:brightness(0.9)}\n.nz-btn--quiet{background:transparent;color:var(--nz-text-link);text-decoration:underline;padding-left:6px;padding-right:6px}\n.nz-btn--quiet:hover:not(:disabled){color:var(--nz-accent-ink)}\n.nz-btn:disabled{cursor:not-allowed;background:var(--color-nz-neutral-300);color:var(--color-nz-neutral-500);border-color:transparent;filter:none}\n\n/* ---- Badge ---- */\n.nz-badge{display:inline-block;font-size:10px;font-weight:var(--nz-weight-bold);letter-spacing:0.1em;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-nz-sm);line-height:1.4}\n.nz-badge--brand{background:var(--color-nz-red-dark);color:#fff}\n.nz-badge--neutral{background:var(--color-nz-neutral-200);color:var(--color-nz-neutral-700)}\n.nz-badge--success{background:var(--color-nz-success-bg);color:var(--color-nz-success)}\n.nz-badge--warning{background:var(--color-nz-warning-bg);color:var(--color-nz-warning)}\n.nz-badge--error{background:var(--color-nz-error-bg);color:var(--color-nz-error)}\n\n/* ---- Card ---- */\n.nz-card{background:#fff;border:1px solid var(--nz-border);border-radius:var(--radius-nz-md);box-shadow:var(--shadow-nz-sm);overflow:hidden}\n.nz-card__head{background:var(--nz-accent);color:var(--nz-accent-text);padding:12px 16px}\n.nz-card__head p{margin:0;font-family:var(--font-display);font-weight:var(--nz-weight-bold);font-size:var(--text-lg)}\n.nz-card__body{padding:16px}\n\n/* ---- Alert. Hard left border, never an icon circle. ---- */\n.nz-alert{display:flex;gap:12px;padding:16px;margin-bottom:12px;border-radius:var(--radius-nz-md);border-left:4px solid;font-size:var(--text-sm)}\n.nz-alert__mark{font-weight:var(--nz-weight-bold);flex-shrink:0}\n.nz-alert__body strong{display:block}\n.nz-alert--success{background:var(--color-nz-success-bg);border-color:var(--color-nz-success);color:var(--color-nz-success-text)}\n.nz-alert--warning{background:var(--color-nz-warning-bg);border-color:var(--color-nz-warning);color:var(--color-nz-warning-text)}\n.nz-alert--error{background:var(--color-nz-error-bg);border-color:var(--color-nz-error);color:var(--color-nz-error-text)}\n.nz-alert--info{background:var(--color-nz-info-bg);border-color:var(--color-nz-info);color:var(--color-nz-info-text)}\n\n/* ---- Field: Input, Select ---- */\n.nz-field{max-width:24rem}\n.nz-field__label{display:block;font-size:var(--text-sm);font-weight:var(--nz-weight-bold);margin-bottom:8px;color:var(--color-nz-gray-dark)}\n.nz-field__control{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--radius-nz-md);background:#fff;color:var(--color-nz-gray-dark);font-family:var(--font-body);font-size:var(--text-base);border:1px solid var(--nz-border-strong);transition:border-color var(--nz-duration) var(--nz-ease)}\n.nz-field__control::placeholder{color:var(--color-nz-neutral-400)}\n.nz-field__control:focus{border-color:var(--color-nz-blue-dark)}\n.nz-field__control--error,.nz-field__control--error:focus{border-color:var(--color-nz-error)}\n.nz-field__control:disabled{background:var(--color-nz-neutral-50);color:var(--color-nz-neutral-500);cursor:not-allowed}\n.nz-field__hint{font-size:var(--text-xs);color:var(--color-nz-neutral-500);margin:8px 0 0}\n.nz-field__error{font-size:var(--text-xs);color:var(--color-nz-error);font-weight:var(--nz-weight-bold);margin:8px 0 0}\n\n/* ---- Table. 2px accent underline on the header, single hairline rows. ---- */\n.nz-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}\n.nz-table th{text-align:left;padding:12px;background:var(--color-nz-neutral-50);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.06em;border-bottom:2px solid var(--nz-accent)}\n.nz-table td{padding:12px;border-bottom:1px solid var(--color-nz-neutral-200)}\n\n<\u002Fstyle>\n  <script src=\"a935b7b8-3a4f-4167-a6ea-756d5fa98436\"><\u002Fscript>\n  <title>Benefits | Careers | Nazdar<\u002Ftitle>\n  <style>body{margin:0;background:#fff}a{color:var(--nz-text-link)}a:hover{color:var(--color-nz-red-dark)}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:Campton, Calibri, Arial, sans-serif;color:var(--nz-text-primary);background:#fff;min-height:100vh\">\n  <div>\n  <header style=\"border-bottom:1px solid var(--nz-border)\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap\">\n      <a href=\"https://www.nazdar.com/\" style=\"display:flex\"><img src=\"99ce31bb-5d28-40ea-a93c-0744f2da9fac\" alt=\"Nazdar\" style=\"width:140px;height:auto;display:block\"><\u002Fa>\n      <nav style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:center;font-size:14px;font-weight:500\">\n        <a href=\"https://www.nazdar.com/\" style=\"color:var(--nz-text-primary);text-decoration:none;white-space:nowrap\">Products and services<\u002Fa>\n        <a href=\"https://www.nazdar.com/Where-To-Buy\" style=\"color:var(--nz-text-primary);text-decoration:none;white-space:nowrap\">Where to buy<\u002Fa>\n        <a href=\"index.html\" style=\"color:var(--nz-accent-ink);text-decoration:none;font-weight:700;white-space:nowrap\">Careers<\u002Fa>\n        <a href=\"https://www.nazdar.com/\" style=\"color:var(--nz-text-primary);text-decoration:none;white-space:nowrap\">Contact us<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"border-bottom:1px solid var(--nz-border);background:var(--nz-surface-sunken)\">\n    <nav aria-label=\"Careers\" style=\"max-width:1080px;margin:0 auto;padding:0 24px;display:flex;gap:4px 24px;flex-wrap:wrap;align-items:center;font-size:14px\">\n<a href=\"index.html\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-text-primary);font-weight:500\">Overview<\u002Fa>\n<a href=\"faq.html\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-text-primary);font-weight:500\">FAQs<\u002Fa>\n<a href=\"culture.html\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-text-primary);font-weight:500\">Culture<\u002Fa>\n<a href=\"community.html\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-text-primary);font-weight:500\">Community<\u002Fa>\n<a href=\"benefits.html\" aria-current=\"page\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-accent-ink);font-weight:700\">Benefits<\u002Fa>\n<a href=\"history.html\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-text-primary);font-weight:500\">History<\u002Fa>\n<a href=\"leadership.html\" style=\"padding:14px 0;text-decoration:none;white-space:nowrap;color:var(--nz-text-primary);font-weight:500\">Leadership team<\u002Fa>\n      <a href=\"https://recruiting.ultipro.com/NAZ1000NAZ/JobBoard/f0764a2c-4470-4fa2-9660-98239285d203/?q=&amp;o=postedDateDesc\" target=\"_blank\" rel=\"noopener\" style=\"padding:14px 0;margin-left:auto;white-space:nowrap;font-weight:700;color:var(--nz-accent-ink);text-decoration:none\">Job postings ↗<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n  <div style=\"max-width:1080px;margin:0 auto;padding:24px 24px 0;font-size:14px;color:var(--nz-text-secondary);display:flex;gap:8px;flex-wrap:wrap\"><a href=\"https://www.nazdar.com/\">Home<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><a href=\"index.html\">Careers<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span style=\"color:var(--nz-text-primary)\">Life at Nazdar<\u002Fspan><span aria-hidden=\"true\">/<\u002Fspan><span style=\"color:var(--nz-text-primary)\">Benefits<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n  <main style=\"max-width:1080px;margin:0 auto;padding:0 24px\">\n    <section style=\"padding:40px 0 48px;display:grid;gap:20px\">\n      <div class=\"nz-label\" style=\"color:var(--nz-accent-ink)\">Life at Nazdar<\u002Fdiv>\n      <h1 style=\"margin:0;font-size:49px;line-height:1.15;letter-spacing:-0.02em;font-weight:700\">Your benefits at Nazdar<\u002Fh1>\n      <p style=\"margin:0;font-size:20px;line-height:1.55\">Why people work here<\u002Fp>\n    <\u002Fsection>\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:2px solid var(--nz-accent);border-bottom:1px solid var(--nz-border)\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"padding:24px 24px 28px 0;display:grid;gap:8px;align-content:start\">\n          <div style=\"font-size:49px;line-height:1;letter-spacing:-0.02em;font-weight:700;color:var(--nz-accent-ink)\">{{ s.v }}<\u002Fdiv>\n          <div style=\"line-height:1.45;max-width:220px\">{{ s.l }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <section style=\"padding:56px 0 48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px 56px;align-items:start\">\n      <div style=\"display:grid;gap:16px\">\n        <div class=\"nz-label\" style=\"color:var(--nz-text-secondary)\">DELTA Well-Being Program<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:39px;line-height:1.15;letter-spacing:-0.02em;font-weight:700;text-wrap:balance\">Award-winning health and wellness programs<\u002Fh2>\n        <img src=\"https://www.nazdar.com/portals/0/Promo/Images/badges.png\" alt=\"Wellness award badges\" style=\"max-width:100%;height:auto;display:block;margin-top:8px\">\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:16px\">\n        <p style=\"margin:0;line-height:1.55;text-wrap:pretty\">At Nazdar, employee well-being is part of our culture. Through our award-winning DELTA Well-Being Program, we support the physical, emotional, financial, and social well-being of our employees and their families. DELTA, which originated from Diet, Exercise, and Lifestyle Turn-Around, represents our commitment to positive, lasting change and helping employees live healthier lives.<\u002Fp>\n        <p style=\"margin:0;line-height:1.55;text-wrap:pretty\">Our commitment to well-being has earned both local and national recognition. Year after year, Nazdar receives recognition through the Cigna Healthy Workforce Designation, the American Heart Association Well-Being Works Better Scorecard, and the Kansas City Business Journal's Healthiest Employers program. Most recently, Nazdar was named one of the 2026 Healthiest 100 Workplaces in America, earning the #35 ranking nationwide for its commitment to employee well-being and exceptional wellness programming.<\u002Fp>\n        <p style=\"margin:0;line-height:1.55;text-wrap:pretty\">While well-being is a cornerstone of our culture, we also provide a competitive and comprehensive benefits package designed to support employees through every stage of life.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"padding:48px 0 64px;border-top:1px solid var(--nz-border);display:grid;gap:24px\">\n      <div class=\"nz-label\" style=\"color:var(--nz-text-secondary)\">What’s included<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Card\" title=\"{{ g.title }}\" hint-size=\"100%,200px\">\n            <ul style=\"margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.55\">\n              <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\"><li>{{ i }}<\u002Fli><\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fx-import>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <footer style=\"font-family:Campton, Calibri, Arial, sans-serif;border-top:1px solid var(--nz-border);background:var(--nz-surface-sunken);color:var(--nz-text-secondary)\">\n  <div style=\"max-width:1080px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;font-size:14px;line-height:1.55\">\n    <div style=\"display:grid;gap:12px;align-content:start\">\n      <img src=\"99ce31bb-5d28-40ea-a93c-0744f2da9fac\" alt=\"Nazdar\" style=\"width:110px;height:auto;display:block\">\n      <div>World Headquarters, Shawnee, KS<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px;align-content:start\">\n      <div class=\"nz-label\">Life at Nazdar<\u002Fdiv>\n      <a href=\"culture.html\">Culture<\u002Fa><a href=\"community.html\">Community<\u002Fa><a href=\"benefits.html\">Benefits<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px;align-content:start\">\n      <div class=\"nz-label\">About us<\u002Fdiv>\n      <a href=\"history.html\">History<\u002Fa><a href=\"leadership.html\">Leadership team<\u002Fa>\n      <div class=\"nz-label\" style=\"padding-top:12px\">Careers<\u002Fdiv>\n      <a href=\"https://recruiting.ultipro.com/NAZ1000NAZ/JobBoard/f0764a2c-4470-4fa2-9660-98239285d203/?q=&amp;o=postedDateDesc\">Job postings<\u002Fa><a href=\"faq.html\">FAQs<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px;align-content:start\">\n      <div class=\"nz-label\">Related<\u002Fdiv>\n      <a href=\"https://sourceone.nazdar.com/\">Nazdar SourceOne<\u002Fa><a href=\"https://consulting.nazdar.com/\">Nazdar Consulting Services<\u002Fa><a href=\"https://www.youtube.com/watch?v=KiIXTyPfbOw\">Overview video<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1080px;margin:0 auto;padding:16px 24px 32px;border-top:1px solid var(--nz-border);font-size:14px\">Nazdar is an Equal Opportunity Employer.<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst STATS = [['$200+', 'Earned each year through wellness participation'], ['401(k)', 'Retirement savings plan with company match'], ['$0', 'Virtual doctor visits, 24/7, no copays or fees'], ['HSA', 'Health Savings Account with employer contribution']];\nconst GROUPS = [\n  ['Health coverage', ['Medical, dental and vision, with prescription savings', 'Multiple plan options for individuals and families', 'Flexible Spending Accounts available', 'Company-paid life insurance and disability coverage']],\n  ['Virtual care and mental health', ['Virtual doctor visits 24/7, no copays, family included', 'Unlimited mental health counseling, by phone or video', 'Employee Assistance Program, virtual or in person', 'Personalized weight management service']],\n  ['DELTA Well-Being Program', ['Cash incentives and healthcare premium discounts', 'Wellness challenges and healthy habit tracking', 'Resources for physical, emotional, financial and lifestyle well-being']],\n  ['Money, time and growth', ['Paid time off, company paid holidays, floating holidays, volunteer time off and Wellness PTO', 'Educational Assistance Program and scholarships for dependents', 'Financial wellness resources', 'Employee discount and perks program']]\n];\nclass Component extends DCLogic {\n  renderVals() { return { stats: STATS.map(([v, l]) => ({ v, l })), groups: GROUPS.map(([title, items]) => ({ title, items })) }; }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
